name: ML checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: ruff check ml shared tests
      - run: black --check ml shared tests
      - run: mypy shared
      - run: pytest -q
      - run: python -m ml.training.train
      - run: python -m ml.demo
      - run: python -m ml.training.improve fit
      - run: python -m ml.demo_v2
